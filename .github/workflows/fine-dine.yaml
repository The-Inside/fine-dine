name: Fine Dine CI/CD

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'services/**'
      - '.github/workflows/microservices-ci.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'services/**'

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      auth-service: ${{ steps.changes.outputs.auth-service }}
      customer-service: ${{ steps.changes.outputs.customer-service }}
      rider-service: ${{ steps.changes.outputs.rider-service }}
      restaurant-service: ${{ steps.changes.outputs.restaurant-service }}
      order-service: ${{ steps.changes.outputs.order-service }}
      payment-service: ${{ steps.changes.outputs.payment-service }}
      dispatch-service: ${{ steps.changes.outputs.dispatch-service }}
      discovery-service: ${{ steps.changes.outputs.discovery-service }}
      apigateway: ${{ steps.changes.outputs.apigateway }}
      common: ${{ steps.changes.outputs.common }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            common:
              - 'services/common/**'
            auth-service:
              - 'services/auth-service/**'
            customer-service:
              - 'services/customer-service/**'
            rider-service:
              - 'services/rider-service/**'
            restaurant-service:
              - 'services/restaurant-service/**'
            order-service:
              - 'services/order-service/**'
            payment-service:
              - 'services/payment-service/**'
            dispatch-service:
              - 'services/dispatch-service/**'
            discovery-service:
              - 'services/discovery-service/**'
            apigateway:
              - 'services/apigateway/**'

  # Build parent POM and common module - all services depend on this
  build-common:
    name: Build Parent POM and Common Module
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install parent POM
        run: mvn clean install -N
        working-directory: services

      - name: Build and install common module
        run: mvn clean install -DskipTests
        working-directory: services/common

  # Auth Service
  test-auth-service:
    name: Test Auth Service
    needs: [detect-changes, build-common]
    if: needs.detect-changes.outputs.auth-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install parent POM and common module
        run: |
          mvn install -N
          cd common && mvn clean install -DskipTests
        working-directory: services

      - name: Run tests
        run: mvn test
        working-directory: services/auth-service

  build-auth-service:
