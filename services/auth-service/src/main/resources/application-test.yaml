spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:h2:mem:testdb
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  # Disable Redis auto-configuration for tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  security:
    oauth2:
      authorization-server:
        endpoint:
          jwk-set-uri: "http://localhost:8081/.well-known/jwks.json"

  mail:
    host: smtp.gmail.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false

  jpa:
    properties:
      hibernate:
        format_sql: true
        ddl-auto: create-drop
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

cors:
  allowed-origins:
    http://localhost:3000

# Disable rate limiting for tests
rate-limit:
  enabled: false

aws:
  s3:
    region: us-east-1
    bucket-name: fds-bucket-1
  sqs:
    restaurant:
      restaurant-registration-queue: fds-restaurant-registration-queue.fifo
      endpoint: https://sqs.us-east-1.amazonaws.com/082608135264/fds-restaurant-registration-queue.fifo
    rider:
      rider-registration-queue: fds-rider-registration-queue.fifo
      endpoint: https://sqs.us-east-1.amazonaws.com/082608135264/fds-rider-registration-queue.fifo
    customer:
      customer-registration-queue: fds-customer-registration-queue.fifo
      endpoint: https://sqs.us-east-1.amazonaws.com/082608135264/fds-customer-registration-queue.fifo

# Don't configure RSA keys for tests - let KeyManager generate them
# rsa:
#   public-key: classpath:certs/public.pem
#   private-key: classpath:certs/private.pem
#   key-rotation-interval: 604800

server:
  port: 8090